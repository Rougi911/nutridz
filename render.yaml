services:
  # ─── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: nutridz-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render génère automatiquement une valeur sécurisée
      - key: ANTHROPIC_API_KEY
        sync: false                  # À renseigner manuellement dans le dashboard Render
      - key: FRONTEND_URL
        fromService:
          name: nutridz-web
          type: web
          property: host
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # ─── Frontend React (PWA) ───────────────────────────────────────────────────
  - type: web
    name: nutridz-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: true
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache              # Le SW doit toujours être à jour
      - path: /manifest.json
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nutridz-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html    # SPA fallback
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: nutridz-api
          type: web
          property: host
