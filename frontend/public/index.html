<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA obligatoire -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A6B3C" />

    <!-- iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutraLance" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NutraLance" />

    <!-- SEO / partage -->
    <meta name="description" content="NutraLance — Your Daily Wellness Companion. Track calories, scan products, analyze meals." />
    <meta property="og:title" content="NutraLance" />
    <meta property="og:description" content="Your Daily Wellness Companion" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Icône navigateur -->
    <link rel="icon" href="/icons/icon-96.png" />

    <!-- Tabler Icons (utilisés dans l'app) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css" />

    <title>NutraLance</title>
  </head>

    <noscript>Activez JavaScript pour utiliser NutraLance.</noscript>
    <div id="root"></div>

</html>
