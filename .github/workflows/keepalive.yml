name: keep-alive

# Garde les instances Render éveillées pour éviter le cold start (~30-60s) au
# premier chargement. Render endort le service après ~15 min d'inactivité ;
# on ping toutes les ~10 min. Gratuit (GitHub Actions).
#
# NOTE : GitHub peut retarder/regrouper les jobs schedule en période de charge,
# et désactive le schedule après 60 jours sans commit sur le repo.

on:
  schedule:
    - cron: '*/10 * * * *'   # toutes les 10 minutes
  workflow_dispatch:          # permet un déclenchement manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://nutridz-2.onrender.com/health) && break
            echo "tentative $i échouée, nouvelle tentative..."; sleep 10
          done
          echo "backend /health -> HTTP $code"

      - name: Ping frontend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://nutrivita-v0.onrender.com/ || echo "000")
          echo "frontend / -> HTTP $code"
